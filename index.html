<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darshika Jain | Visual Systems & Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-serif: 'Cormorant Garamond', serif;
        --font-sans: 'Inter', sans-serif;
      }
      body {
        font-family: var(--font-sans);
        background-color: #FAFAF9; /* stone-50 */
        color: #1C1917; /* stone-900 */
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-serif);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D6D3D1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #A8A29E;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Pinterest-style Masonry Grid */
      .masonry-grid {
        columns: 4;
        column-gap: 16px;
      }
      .masonry-item {
        break-inside: avoid;
        margin-bottom: 16px;
      }
      @media (max-width: 1280px) {
        .masonry-grid { columns: 3; }
      }
      @media (max-width: 768px) {
        .masonry-grid { columns: 2; column-gap: 10px; }
        .masonry-item { margin-bottom: 10px; }
      }
      @media (max-width: 480px) {
        .masonry-grid { columns: 1; column-gap: 8px; }
        .masonry-item { margin-bottom: 8px; }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cormorant Garamond', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              accent: '#A34829', // Terracotta / Clay
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {

    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "maath/": "https://esm.sh/maath@^0.10.8/"
  }
}
</script>
